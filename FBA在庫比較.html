<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>テンポスター × FBA 在庫比較</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap');
  :root {
    --ink: #2A2440; --ink-soft: #74708C; --line: #ECE9F7;
    --accent: #FF6B4A; --accent-soft: #FFE7DE;
    --violet: #7B5FFF; --violet-soft: #EDE9FF;
    --coral: #FF4D6D; --mint: #12B886;
    /* グラフ（納品推奨数システムv5と同じ配色） */
    --g-accent: #1a56db; --g-border: rgba(0,0,0,0.1); --g-border-md: rgba(0,0,0,0.18); --g-muted: #6b6b67;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 4px 2px 24px; font-family: 'Noto Sans JP', -apple-system, "Segoe UI", Meiryo, sans-serif;
         color: var(--ink); background: transparent; font-size: 13px; position: relative; }
  h2 { font-family: 'M PLUS Rounded 1c', sans-serif; font-size: 18px; margin: 0 0 4px; }
  .muted { color: var(--ink-soft); font-size: 12px; }
  .card { background: #fff; border-radius: 18px; box-shadow: 0 4px 16px rgba(42,36,64,0.08); padding: 16px 18px; margin-bottom: 14px; }

  /* アップロード */
  .drop { border: 2px dashed #CFC6FF; border-radius: 16px; background: var(--violet-soft); padding: 22px; text-align: center;
          cursor: pointer; transition: background .15s, border-color .15s; }
  .drop.over { background: #E1DAFF; border-color: var(--violet); }
  .drop b { color: var(--violet); }
  .drop .file { margin-top: 6px; font-weight: 700; }
  .err { color: var(--coral); font-weight: 700; margin-top: 8px; }

  /* サマリー */
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
  .stat { background: #fff; border-radius: 16px; padding: 12px 14px; box-shadow: 0 4px 16px rgba(42,36,64,0.08); }
  .stat .lbl { font-size: 11px; color: var(--ink-soft); font-weight: 700; }
  .stat .val { font-family: 'M PLUS Rounded 1c', sans-serif; font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .stat.v .val { color: var(--violet); } .stat.a .val { color: var(--accent); } .stat.m .val { color: var(--mint); }
  .note { font-size: 11.5px; color: var(--ink-soft); margin: 8px 2px 14px; line-height: 1.6; }

  /* 操作 */
  .controls { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; }
  .seg { display: inline-flex; background: var(--violet-soft); border-radius: 999px; padding: 4px; gap: 2px; }
  .seg button { border: 0; background: transparent; color: var(--violet); font-weight: 700; padding: 7px 14px; border-radius: 999px;
                cursor: pointer; font-size: 13px; font-family: inherit; }
  .seg button.on { background: #fff; color: var(--ink); box-shadow: 0 2px 6px rgba(123,95,255,.25); }
  input[type=search] { border: 2px solid var(--line); border-radius: 999px; padding: 8px 14px; font-size: 13px; min-width: 300px;
                       font-family: inherit; outline: none; }
  input[type=search]:focus { border-color: var(--violet); }
  label.chk { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; }
  .btn { border: 2px solid var(--violet-soft); background: #fff; color: var(--violet); border-radius: 999px; padding: 6px 14px;
         font-weight: 700; cursor: pointer; font-family: inherit; font-size: 12.5px; }
  .btn:hover { background: var(--violet-soft); }
  .btn.warn { border-color: #FFD6CC; color: var(--accent); }
  .btn.warn:hover { background: var(--accent-soft); }
  .cols { display: none; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .cols.open { display: flex; }
  .chip { border: 2px solid var(--violet-soft); border-radius: 999px; padding: 4px 11px; font-size: 12px; cursor: pointer; user-select: none;
          color: var(--ink-soft); background: #fff; }
  .chip.on { background: var(--violet); border-color: var(--violet); color: #fff; }
  .hint { font-size: 12px; color: var(--ink-soft); }
  .active-filters { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .active-filters:empty { display: none; }
  .af { background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 3px 4px 3px 11px; font-size: 12px; font-weight: 700; }
  .af button { border: 0; background: transparent; color: var(--accent); cursor: pointer; font-weight: 800; padding: 0 6px; }

  /* テーブル */
  .wrap { background: #fff; border-radius: 18px; box-shadow: 0 4px 16px rgba(42,36,64,0.10); overflow: hidden; }
  .scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th { background: var(--violet-soft); color: var(--violet); font-size: 12px; font-weight: 700; font-family: 'M PLUS Rounded 1c', sans-serif;
       padding: 0; white-space: nowrap; text-align: left; }
  thead th { position: relative; z-index: 3; will-change: transform; }
  thead.stuck th { box-shadow: 0 3px 6px -2px rgba(42,36,64,0.18); }
  th .th-in { display: flex; align-items: center; gap: 2px; padding: 9px 6px 9px 10px; }
  th.num .th-in { justify-content: flex-end; }
  th .lab { cursor: pointer; user-select: none; }
  th .ar { margin-left: 3px; opacity: .45; font-size: 10px; }
  th.sorted .ar { opacity: 1; color: var(--accent); }
  th .fbtn { border: 1px solid transparent; background: transparent; color: var(--violet); border-radius: 6px; cursor: pointer; font-size: 10px;
             padding: 2px 5px; line-height: 1.2; opacity: .55; }
  th .fbtn:hover { opacity: 1; background: #fff; border-color: #D9D1FF; }
  th .fbtn.on { opacity: 1; background: var(--accent); color: #fff; }
  td { padding: 8px 10px; border-bottom: 1px solid #F1EEFC; vertical-align: middle; }
  th.num, td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  td.mono { font-family: Consolas, Menlo, monospace; font-size: 12px; white-space: nowrap; }
  tbody tr.r { cursor: pointer; }
  tbody tr.r:hover { background: var(--accent-soft); }
  td img { max-height: 52px; width: auto; display: block; margin: auto; border-radius: 8px; }
  .name { max-width: 300px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.35em; cursor: text; }
  .zero { color: #C9C5D8; }
  .tag { display: inline-block; font-size: 11px; font-weight: 700; border-radius: 999px; padding: 2px 9px; white-space: nowrap; }
  .tag.out { background: #FFE3E8; color: var(--coral); }
  .tag.low { background: #FFF1DC; color: #D9780A; }
  .pager { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-top: 1px solid #F1EEFC; background: #FAFAFF; color: var(--ink-soft); }
  .pager .sp { margin-left: auto; }
  .pager button:disabled { opacity: .4; cursor: default; }
  .empty { padding: 40px; text-align: center; color: var(--ink-soft); }

  /* Excel風フィルター */
  .fmenu { position: absolute; z-index: 9000; width: 280px; background: #fff; border: 1px solid #DDD7F5; border-radius: 12px;
           box-shadow: 0 12px 32px rgba(42,36,64,0.22); padding: 10px; font-size: 12.5px; display: none; }
  .fmenu .sorts { display: flex; flex-direction: column; gap: 2px; padding-bottom: 8px; border-bottom: 1px solid var(--line); margin-bottom: 8px; }
  .fmenu .sorts button { text-align: left; border: 0; background: transparent; padding: 5px 8px; border-radius: 6px; cursor: pointer; font-family: inherit; font-size: 12.5px; color: var(--ink); }
  .fmenu .sorts button:hover { background: var(--violet-soft); }
  .fmenu .range { display: flex; gap: 6px; align-items: center; margin-bottom: 8px; }
  .fmenu .range input { width: 100%; border: 1px solid #DDD7F5; border-radius: 6px; padding: 5px 7px; font-family: inherit; font-size: 12px; }
  .fmenu .fsearch { min-width: 0; border-radius: 6px !important; width: 100%; border: 1px solid #DDD7F5; border-radius: 6px; padding: 6px 8px; font-family: inherit; font-size: 12px; margin-bottom: 6px; }
  .fmenu .vals { max-height: 240px; overflow-y: auto; border: 1px solid var(--line); border-radius: 8px; padding: 4px 0; }
  .fmenu .vals label { display: flex; align-items: center; gap: 6px; padding: 3px 8px; cursor: pointer; white-space: nowrap; }
  .fmenu .vals label:hover { background: #F7F5FF; }
  .fmenu .vals .cnt { margin-left: auto; color: var(--ink-soft); font-size: 11px; padding-left: 8px; }
  .fmenu .vals .all { font-weight: 700; border-bottom: 1px solid var(--line); margin-bottom: 2px; }
  .fmenu .vals .more { color: var(--ink-soft); padding: 4px 8px; font-size: 11px; }
  .fmenu .fbtns { display: flex; justify-content: flex-end; gap: 6px; margin-top: 8px; }
  .fmenu .fbtns .clear { margin-right: auto; }
  .fmenu .ok { background: var(--violet); border-color: var(--violet); color: #fff; }
  .fmenu .ok:hover { background: #6A4EF0; }

  /* 在庫推移グラフ モーダル（納品推奨数システムv5と同じ作り） */
  .stock-modal-backdrop { position: absolute; left: 0; width: 100%; background: rgba(0,0,0,0.42); z-index: 10000;
                          display: flex; align-items: center; justify-content: center; }
  .stock-modal { background: #fff; border-radius: 12px; padding: 18px 20px 20px; width: 700px; max-width: 92vw; max-height: 86vh;
                 overflow: auto; box-shadow: 0 12px 36px rgba(0,0,0,0.25); font-family: 'Hiragino Sans', 'Yu Gothic UI', 'Meiryo UI', sans-serif; }
  .stock-modal-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
  .stock-modal-title { font-weight: 700; font-size: 15px; }
  .close-btn { border: 1px solid var(--g-border-md); background: #fff; border-radius: 8px; padding: 5px 12px; cursor: pointer; font-size: 13px; font-family: inherit; }
  .close-btn:hover { background: #f0efe9; }
  .modal-tools { display: flex; align-items: center; gap: 8px; }
  .periods { display: inline-flex; gap: 4px; }
  .periods button { border: 1px solid var(--g-border-md); background: #fff; color: var(--g-muted); border-radius: 999px; padding: 3px 11px;
                    font-size: 12px; font-weight: 700; cursor: pointer; font-family: inherit; }
  .periods button.on { background: var(--g-accent); border-color: var(--g-accent); color: #fff; }
  .breakdown { margin-top: 14px; border-top: 1px solid var(--g-border); padding-top: 12px; }
  .breakdown .bt { font-size: 12px; font-weight: 700; color: var(--g-muted); margin-bottom: 6px; }
  .breakdown .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .breakdown .chips span { background: #f7f6f3; border: 1px solid var(--g-border); border-radius: 8px; padding: 4px 10px; font-size: 12px; }
  .breakdown .chips span.main { background: #eff4ff; border-color: #c7d7fb; }
  .breakdown b { font-variant-numeric: tabular-nums; }
</style>
</head>
<body>

<!-- 在庫推移グラフ モーダル -->
<div id="stock-modal-backdrop" class="stock-modal-backdrop" style="display:none;">
  <div class="stock-modal" id="stock-modal">
    <div class="stock-modal-head">
      <span id="stock-modal-title" class="stock-modal-title">📈 在庫推移</span>
      <span class="modal-tools"><span class="periods" id="stock-periods"></span><button class="close-btn" id="stock-modal-close">✕ 閉じる</button></span>
    </div>
    <div id="stock-modal-body"></div>
  </div>
</div>

<!-- Excel風フィルター -->
<div class="fmenu" id="fmenu"></div>

<div class="card">
  <h2>📦 テンポスター × FBA 在庫比較</h2>
  <div class="muted" id="dataInfo"></div>
  <div class="drop" id="drop" style="margin-top:12px">
    <div>Amazonの<b>在庫補充レポートCSV</b>をここにドラッグ、またはクリックして選択</div>
    <div class="muted">（セラーセントラル → 在庫 → 在庫補充 からダウンロードしたCSV）</div>
    <div class="file" id="fileName"></div>
    <input type="file" id="fileInput" accept=".csv,text/csv" hidden>
  </div>
  <div class="err" id="err"></div>
</div>

<div id="main" style="display:none">
  <div class="stats" id="stats"></div>
  <div class="note">
    FBA在庫合計＝レポートの「販売可能な商品の合計」（在庫あり＋FC処理中＋出荷待ち＋FC移管中＋入荷待ち。販売不可は含まない）。
    複数のAmazon SKUが同じ商品コードに紐づく場合は1行に合算しています。
    各列見出しの ▼ で、Excelのように値を選んで絞り込めます。行をクリックすると在庫推移グラフが開きます。
  </div>

  <div class="card">
    <div class="controls">
      <div class="seg" id="seg"></div>
      <input type="search" id="kw" placeholder="🔍 商品コード・Amazon SKU・商品名・ASIN・FNSKU">
      <label class="chk"><input type="checkbox" id="hideZero">FBA在庫合計0の商品を除く</label>
      <button class="btn" id="colBtn">表示する列 ▾</button>
      <button class="btn warn" id="clearFilters" style="display:none">フィルターをすべて解除</button>
      <span class="hint" id="viewHint"></span>
    </div>
    <div class="cols" id="cols"></div>
    <div class="active-filters" id="activeFilters"></div>
  </div>

  <div class="wrap">
    <div class="scroll"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div>
    <div class="pager" id="pager"></div>
  </div>
</div>

<script>
(function () {
  "use strict";
  const D = window.__FBA_DATA__ || { ts: {}, names: {}, img: {}, hist: {}, master: {}, meta: {} };
  const PAGE = 100;
  const LIST_LIMIT = 1000;   // フィルターの値リストに一度に出す最大件数（検索で絞り込める）

  const COLS = [
    { k: "img",    l: "画像",             t: "img",  def: true },
    { k: "code",   l: "商品コード",       t: "mono", def: true, fixed: true },
    { k: "asku",   l: "Amazon SKU",       t: "mono", def: true },
    { k: "name",   l: "商品名",           t: "name", def: true },
    { k: "a1",     l: "属性1名",          t: "text", def: true },
    { k: "a2",     l: "属性2名",          t: "text", def: true },
    { k: "asin",   l: "ASIN",             t: "mono", def: true },
    { k: "fnsku",  l: "FNSKU",            t: "mono" },
    { k: "fTotal", l: "FBA在庫合計",      t: "num",  def: true },
    { k: "fAvail", l: "在庫あり",         t: "num" },
    { k: "fProc",  l: "FC処理中",         t: "num" },
    { k: "fShip",  l: "出荷待ち",         t: "num" },
    { k: "fTrans", l: "FC移管中",         t: "num" },
    { k: "fIn",    l: "入荷待ち",         t: "num" },
    { k: "fUns",   l: "販売不可",         t: "num" },
    { k: "f30",    l: "過去30日販売数",   t: "num",  def: true },
    { k: "fDays",  l: "在庫日数（受領中含む）", t: "days", def: true },
    { k: "fRec",   l: "Amazon推奨補充数", t: "num",  def: true },
    { k: "alert",  l: "注意",             t: "alert" },
    { k: "tStock", l: "テンポスター現在庫", t: "num", def: true },
  ];
  const COL = Object.fromEntries(COLS.map(c => [c.k, c]));
  const NUM_SRC = {
    fTotal: "販売可能な商品の合計", fAvail: "在庫あり", fProc: "入出荷作業中 - FC処理中", fShip: "入出荷作業中 - 出荷待ち",
    fTrans: "FC移管中", fIn: "入荷待ち", fUns: "販売不可", f30: "過去30日間に販売されたユニット数", fRec: "推奨される在庫補充数量",
  };
  // 在庫日数：レポートでは「365+」のような値もあるため、365日超は 366 として持ち、表示は「365+」にする
  const DAYS_SRC = "在庫日数の合計（受領中の商品も含む）";
  const DAYS_OVER = 366;
  const parseDays = v => { const s = String(v == null ? "" : v).trim(); if (s === "") return null; if (/\+$/.test(s)) return DAYS_OVER; const n = Number(s.replace(/,/g, "")); return isNaN(n) ? null : n; };
  const fmtDays = v => v == null || v === "" ? "" : (v >= DAYS_OVER ? "365+" : fmt(v));
  const ALERT = { out_of_stock: ["在庫切れ", "out"], low_stock: ["在庫少", "low"] };
  const VIEWS = [
    { k: "matched", l: "照合済み", hint: "" },
    { k: "fbaOnly", l: "FBAのみ", hint: "テンポスターの在庫データに無い商品コードです。sku_master の登録漏れを確認してください。" },
  ];

  // shown: 表示する列（初期値は def:true の列）。filters: {列キー: {vals:Set(表示する値), min, max}}
  const S = { data: null, view: "matched", kw: "", hideZero: false, sortKey: "fTotal", sortDir: "desc", page: 0,
              shown: new Set(COLS.filter(c => c.def).map(c => c.k)), filters: {} };
  try {
    const saved = JSON.parse(localStorage.getItem("fbaCmpShown_v3") || "null");
    if (Array.isArray(saved)) S.shown = new Set(saved.filter(k => COL[k]));
  } catch (e) {}
  S.shown.add("code");

  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const fmt = n => (n == null || n === "" || isNaN(n)) ? "" : Number(n).toLocaleString("ja-JP");
  const BLANK = "(空白)";

  // ---------- 上部の情報 ----------
  const nTs = Object.keys(D.ts).length, nMaster = Object.keys(D.master).length;
  $("dataInfo").innerHTML =
    `テンポスター在庫：<b>${esc(D.meta.latest || "-")}</b> 時点（${fmt(nTs)} SKU） ｜ sku_master：${fmt(nMaster)} 件` +
    (nMaster ? "" : ' <span style="color:var(--coral);font-weight:700">（未読み込み：Amazon SKUをそのまま商品コードとして照合します）</span>');

  // ---------- CSV 読み込み ----------
  function decode(buf) {
    const u8 = new Uint8Array(buf);
    if (u8[0] === 0xEF && u8[1] === 0xBB && u8[2] === 0xBF) return new TextDecoder("utf-8").decode(u8.subarray(3));
    try { return new TextDecoder("utf-8", { fatal: true }).decode(u8); }
    catch (e) { return new TextDecoder("shift_jis").decode(u8); }
  }
  function parseCSV(text) {
    const rows = []; let row = [], f = "", q = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (q) {
        if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; }
        else f += c;
      } else if (c === '"') q = true;
      else if (c === ",") { row.push(f); f = ""; }
      else if (c === "\n") { row.push(f); rows.push(row); row = []; f = ""; }
      else if (c !== "\r") f += c;
    }
    if (f !== "" || row.length) { row.push(f); rows.push(row); }
    return rows;
  }
  const numOrNull = v => { const s = String(v == null ? "" : v).trim(); if (s === "") return null; const n = Number(s.replace(/,/g, "")); return isNaN(n) ? null : n; };

  function buildData(rows) {
    const head = rows[0].map(h => h.trim());
    const ix = name => head.indexOf(name);
    if (ix("Merchant SKU") < 0) throw new Error("「Merchant SKU」列が見つかりません。在庫補充レポートのCSVか確認してください。");
    const get = (r, name) => { const i = ix(name); return i < 0 ? "" : (r[i] == null ? "" : String(r[i]).trim()); };

    const byCode = new Map();
    let nRows = 0, nConv = 0;
    for (let ri = 1; ri < rows.length; ri++) {
      const r = rows[ri];
      const sku = get(r, "Merchant SKU");
      if (!sku) continue;
      nRows++;
      const mapped = D.master[sku];
      if (mapped) nConv++;
      const code = mapped || sku;
      let o = byCode.get(code);
      if (!o) {
        o = { code, asku: [], aname: [], asin: [], fnsku: [], alert: [], fRec: null, fDays: null };
        for (const k in NUM_SRC) if (k !== "fRec") o[k] = 0;
        byCode.set(code, o);
      }
      const push = (arr, v) => { if (v && !arr.includes(v)) arr.push(v); };
      push(o.asku, sku); push(o.aname, get(r, "商品名")); push(o.asin, get(r, "ASIN")); push(o.fnsku, get(r, "FNSKU")); push(o.alert, get(r, "注意"));
      for (const k in NUM_SRC) {
        const n = numOrNull(get(r, NUM_SRC[k]));
        if (k === "fRec") { if (n != null) o.fRec = (o.fRec || 0) + n; }
        else o[k] += n || 0;
      }
      // 複数のAmazon SKUが同じ商品コードに紐づく場合、在庫日数は合算できないため一番長い値を採用
      const days = parseDays(get(r, DAYS_SRC));
      if (days != null) o.fDays = o.fDays == null ? days : Math.max(o.fDays, days);
    }

    const matched = [], fbaOnly = [];
    let fbaSum = 0, tsSumMatched = 0;
    byCode.forEach(o => {
      const t = D.ts[o.code];   // [現在庫, 商品基本コード, 属性1名, 属性2名]
      const rec = { code: o.code, asku: o.asku.join(" / "), asin: o.asin.join(" / "), fnsku: o.fnsku.join(" / "),
                    alert: o.alert[0] || "", fRec: o.fRec, fDays: o.fDays };
      for (const k in NUM_SRC) if (k !== "fRec") rec[k] = o[k];
      fbaSum += rec.fTotal;
      if (t) {
        rec.tStock = t[0]; rec.base = t[1]; rec.a1 = t[2]; rec.a2 = t[3];
        rec.name = D.names[t[1]] || o.aname[0] || "";
        rec.img = (t[1] && D.img[t[1]]) || "";
        tsSumMatched += t[0];
        matched.push(rec);
      } else {
        rec.tStock = null; rec.name = o.aname[0] || ""; rec.img = ""; rec.a1 = ""; rec.a2 = "";
        fbaOnly.push(rec);
      }
    });
    return { matched, fbaOnly, nRows, nConv, fbaSum, tsSumMatched };
  }

  function loadFile(file) {
    $("err").textContent = "";
    $("fileName").textContent = file.name;
    const fr = new FileReader();
    fr.onload = () => {
      try {
        const rows = parseCSV(decode(fr.result));
        if (rows.length < 2) throw new Error("CSVにデータ行がありません。");
        S.data = buildData(rows);
        S.page = 0; S.filters = {};
        $("main").style.display = "";
        renderStats(); renderControls(); renderTable();
      } catch (e) {
        $("err").textContent = "読み込みエラー：" + e.message;
        $("main").style.display = "none";
      }
    };
    fr.readAsArrayBuffer(file);
  }
  const drop = $("drop"), fileInput = $("fileInput");
  drop.addEventListener("click", () => fileInput.click());
  fileInput.addEventListener("change", e => { if (e.target.files[0]) loadFile(e.target.files[0]); fileInput.value = ""; });
  ["dragenter", "dragover"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("over"); }));
  ["dragleave", "drop"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("over"); }));
  drop.addEventListener("drop", e => { const f = e.dataTransfer.files[0]; if (f) loadFile(f); });

  // ---------- サマリー ----------
  function renderStats() {
    const d = S.data;
    const items = [
      ["FBA 商品数（CSV行）", d.nRows, "", `うち sku_master で変換 ${fmt(d.nConv)} 件`],
      ["照合済み", d.matched.length, "v"],
      ["FBAのみ", d.fbaOnly.length, "a"],
      ["FBA在庫合計", d.fbaSum, "v"],
      ["テンポスター在庫（照合済み分）", d.tsSumMatched, "m"],
    ];
    $("stats").innerHTML = items.map(([l, v, c, sub]) =>
      `<div class="stat ${c}"><div class="lbl">${esc(l)}</div><div class="val">${fmt(v)}</div>${sub ? `<div class="muted">${esc(sub)}</div>` : ""}</div>`).join("");
  }

  // ---------- 操作パネル ----------
  const curView = () => VIEWS.find(v => v.k === S.view);
  function renderControls() {
    $("seg").innerHTML = VIEWS.map(v =>
      `<button data-v="${v.k}" class="${v.k === S.view ? "on" : ""}">${esc(v.l)}（${fmt(S.data[v.k].length)}）</button>`).join("");
    $("hideZero").checked = S.hideZero;
    $("viewHint").textContent = curView().hint;
    $("cols").innerHTML = COLS.filter(c => !c.fixed).map(c =>
      `<span class="chip ${S.shown.has(c.k) ? "on" : ""}" data-k="${c.k}">${esc(c.l)}</span>`).join("");
    renderActiveFilters();
  }
  function renderActiveFilters() {
    const keys = Object.keys(S.filters);
    $("clearFilters").style.display = keys.length ? "" : "none";
    $("activeFilters").innerHTML = keys.map(k => {
      const f = S.filters[k], parts = [];
      if (f.vals) parts.push(`${fmt(f.vals.size)}件の値`);
      if (f.min != null) parts.push(`${fmt(f.min)}以上`);
      if (f.max != null) parts.push(`${fmt(f.max)}以下`);
      return `<span class="af">${esc(COL[k].l)}：${parts.join("・")}<button data-k="${k}" title="解除">×</button></span>`;
    }).join("");
  }
  $("seg").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    S.view = b.dataset.v; S.page = 0;
    renderControls(); renderTable();
  });
  $("kw").addEventListener("input", e => { S.kw = e.target.value.trim().toLowerCase(); S.page = 0; renderTable(); });
  $("hideZero").addEventListener("change", e => { S.hideZero = e.target.checked; S.page = 0; renderTable(); });
  $("colBtn").addEventListener("click", () => $("cols").classList.toggle("open"));
  $("cols").addEventListener("click", e => {
    const c = e.target.closest(".chip"); if (!c) return;
    const k = c.dataset.k;
    S.shown.has(k) ? S.shown.delete(k) : S.shown.add(k);
    try { localStorage.setItem("fbaCmpShown_v3", JSON.stringify([...S.shown])); } catch (err) {}
    renderControls(); renderTable();
  });
  $("clearFilters").addEventListener("click", () => { S.filters = {}; S.page = 0; renderControls(); renderTable(); });
  $("activeFilters").addEventListener("click", e => {
    const b = e.target.closest("button[data-k]"); if (!b) return;
    delete S.filters[b.dataset.k]; S.page = 0; renderControls(); renderTable();
  });

  const isNumCol = c => c.t === "num" || c.t === "days";
  const shownCols = () => COLS.filter(c => S.shown.has(c.k));

  // ---------- 絞り込み・並び替え ----------
  const cellKey = (r, k) => {          // フィルターで使う「値」（空欄は (空白)）
    const v = r[k];
    if (v == null || v === "") return BLANK;
    if (k === "alert") return ALERT[v] ? ALERT[v][0] : String(v);
    return String(v);
  };
  function passFilter(r, k, f) {
    if (f.vals && !f.vals.has(cellKey(r, k))) return false;
    if (f.min != null || f.max != null) {
      const v = r[k];
      if (v == null || v === "") return false;
      if (f.min != null && v < f.min) return false;
      if (f.max != null && v > f.max) return false;
    }
    return true;
  }
  // exceptKey を指定すると、その列のフィルターだけ無視した結果を返す（Excelと同じく、値リストは他の列の絞り込みを反映）
  function baseRows(exceptKey) {
    let rows = S.data[S.view];
    if (S.hideZero) rows = rows.filter(r => (r.fTotal || 0) > 0);
    if (S.kw) {
      const kw = S.kw;
      rows = rows.filter(r => ["code", "asku", "name", "asin", "fnsku", "base"].some(k => r[k] && String(r[k]).toLowerCase().includes(kw)));
    }
    for (const k in S.filters) if (k !== exceptKey) rows = rows.filter(r => passFilter(r, k, S.filters[k]));
    return rows;
  }
  function sortRows(rows) {
    const k = S.sortKey, dir = S.sortDir === "asc" ? 1 : -1;
    const isNum = COL[k] && isNumCol(COL[k]);
    return rows.slice().sort((a, b) => {
      const x = a[k], y = b[k];
      const xn = x == null || x === "", yn = y == null || y === "";
      if (xn && yn) return 0; if (xn) return 1; if (yn) return -1;     // 空欄は常に最後
      if (isNum) return (x - y) * dir;
      return String(x).localeCompare(String(y), "ja") * dir;
    });
  }

  // ---------- 一覧 ----------
  function cell(c, r) {
    const v = r[c.k];
    switch (c.t) {
      case "img": return `<td>${v ? `<img src="${esc(v)}" loading="lazy" alt="">` : ""}</td>`;
      case "num":
        if (v == null || v === "") return `<td class="num"></td>`;
        return `<td class="num ${v === 0 ? "zero" : ""}">${fmt(v)}</td>`;
      case "days":
        if (v == null || v === "") return `<td class="num"></td>`;
        return `<td class="num ${v === 0 ? "zero" : ""}">${fmtDays(v)}</td>`;
      case "mono": return `<td class="mono">${esc(v)}</td>`;
      case "name": return `<td><div class="name cell-text" title="${esc(v)}">${esc(v)}</div></td>`;
      case "alert": { const a = ALERT[v]; return `<td>${a ? `<span class="tag ${a[1]}">${a[0]}</span>` : esc(v)}</td>`; }
      default: return `<td>${esc(v)}</td>`;
    }
  }

  let pageRows = [];
  function renderTable() {
    const cols = shownCols();
    $("thead").innerHTML = "<tr>" + cols.map(c => {
      const sorted = S.sortKey === c.k;
      const filt = c.t !== "img"
        ? `<button class="fbtn ${S.filters[c.k] ? "on" : ""}" data-f="${c.k}" title="絞り込み">${S.filters[c.k] ? "▼●" : "▼"}</button>` : "";
      return `<th class="${isNumCol(c) ? "num" : ""} ${sorted ? "sorted" : ""}"><div class="th-in">` +
        `<span class="lab" data-k="${c.k}">${esc(c.l)}<span class="ar">${sorted ? (S.sortDir === "asc" ? "▲" : "▼") : ""}</span></span>${filt}</div></th>`;
    }).join("") + "</tr>";

    const rows = sortRows(baseRows());
    const pages = Math.max(1, Math.ceil(rows.length / PAGE));
    if (S.page >= pages) S.page = pages - 1;
    pageRows = rows.slice(S.page * PAGE, (S.page + 1) * PAGE);

    $("tbody").innerHTML = pageRows.length
      ? pageRows.map((r, i) => `<tr class="r" data-i="${i}">` + cols.map(c => cell(c, r)).join("") + "</tr>").join("")
      : `<tr><td colspan="${cols.length}" class="empty">該当する商品がありません</td></tr>`;

    const from = rows.length ? S.page * PAGE + 1 : 0, to = Math.min(rows.length, (S.page + 1) * PAGE);
    $("pager").innerHTML =
      `<button class="btn" data-p="-1" ${S.page === 0 ? "disabled" : ""}>← 前へ</button>` +
      `<span>${S.page + 1} / ${pages} ページ</span>` +
      `<button class="btn" data-p="1" ${S.page >= pages - 1 ? "disabled" : ""}>次へ →</button>` +
      `<span class="sp">${fmt(rows.length)} 件中 ${fmt(from)}–${fmt(to)} 件</span>`;
    scheduleSticky();
  }

  // ---------- 見出し行の固定 ----------
  // このHTMLはStreamlitの中に高さいっぱいで埋め込まれ、スクロールは親ページ側で起きるため、CSSの sticky が効かない。
  // 親ページのスクロール位置から「見出しが画面上端（固定タブの下）に来る位置」を計算して、見出しをずらして表示する。
  function parentTopBar() {
    // 親ページで画面上部に固定表示されているタブ列の下端（無ければ0）
    let bottom = 0;
    try {
      window.parent.document.querySelectorAll('[role="tablist"]').forEach(list => {
        const r = list.getBoundingClientRect();
        if (r.height > 0 && r.top >= -1 && r.top < 200 && r.bottom < 260) {
          let el = list, fixed = false;
          while (el && el !== window.parent.document.body) {
            const p = window.parent.getComputedStyle(el).position;
            if (p === "fixed" || p === "sticky") { fixed = true; break; }
            el = el.parentElement;
          }
          if (fixed) bottom = Math.max(bottom, r.bottom);
        }
      });
    } catch (e) {}
    return bottom;
  }
  let stickyRaf = 0;
  function updateStickyHead() {
    stickyRaf = 0;
    const thead = $("thead");
    const table = thead && thead.closest("table");
    if (!table || $("main").style.display === "none") return;
    let viewTop = 0;   // 親ページの画面上端から見た、このHTMLの上端の位置
    const frame = findSelfIframeInParent();
    if (frame) viewTop = frame.getBoundingClientRect().top;
    else viewTop = -window.scrollY;
    const tRect = table.getBoundingClientRect();
    const tableTopInView = viewTop + tRect.top + (frame ? 0 : window.scrollY);
    const headH = thead.offsetHeight;
    let off = (frame ? parentTopBar() : 0) - tableTopInView;
    off = Math.max(0, Math.min(off, tRect.height - headH));
    const val = off > 0 ? `translateY(${off}px)` : "";
    thead.classList.toggle("stuck", off > 0);
    thead.querySelectorAll("th").forEach(th => { th.style.transform = val; });
  }
  const scheduleSticky = () => { if (!stickyRaf) stickyRaf = requestAnimationFrame(updateStickyHead); };
  try {
    window.parent.addEventListener("scroll", scheduleSticky, true);
    window.parent.addEventListener("resize", scheduleSticky);
  } catch (e) {}
  window.addEventListener("scroll", scheduleSticky, true);
  window.addEventListener("resize", scheduleSticky);

  $("thead").addEventListener("click", e => {
    const fb = e.target.closest(".fbtn");
    if (fb) { e.stopPropagation(); openFilter(fb.dataset.f, fb); return; }
    const lab = e.target.closest(".lab"); if (!lab) return;
    const k = lab.dataset.k;
    if (S.sortKey === k) S.sortDir = S.sortDir === "asc" ? "desc" : "asc";
    else { S.sortKey = k; S.sortDir = isNumCol(COL[k]) ? "desc" : "asc"; }
    renderTable();
  });
  $("pager").addEventListener("click", e => {
    const b = e.target.closest("button[data-p]"); if (!b || b.disabled) return;
    S.page += Number(b.dataset.p); renderTable();
    $("thead").scrollIntoView({ block: "start" });
  });
  $("tbody").addEventListener("click", e => {
    // 商品名などの文字を選択したいときはグラフを開かない
    if (e.target.closest(".cell-text")) return;
    const sel = window.getSelection ? window.getSelection() : null;
    if (sel && sel.toString().length > 0) return;
    const tr = e.target.closest("tr.r"); if (!tr) return;
    const r = pageRows[Number(tr.dataset.i)]; if (!r) return;
    openStockModal(r);
  });

  // ---------- Excel風フィルター ----------
  const fmenu = $("fmenu");
  let fState = null;   // 開いているフィルターの編集中の状態

  function openFilter(k, anchor) {
    const col = COL[k];
    const isNum = isNumCol(col);
    // 他の列の絞り込みを反映した行から、この列の値の一覧を作る
    const counts = new Map();
    baseRows(k).forEach(r => { const v = cellKey(r, k); counts.set(v, (counts.get(v) || 0) + 1); });
    let values = [...counts.keys()];
    values.sort((a, b) => {
      if (a === BLANK) return 1; if (b === BLANK) return -1;
      return isNum ? Number(a) - Number(b) : a.localeCompare(b, "ja");
    });
    const cur = S.filters[k] || {};
    fState = { k, values, counts, checked: new Set(cur.vals ? values.filter(v => cur.vals.has(v)) : values), search: "" };

    fmenu.innerHTML =
      `<div class="sorts">` +
        `<button data-s="asc">${isNum ? "↑ 小さい順に並べ替え" : "↑ 昇順で並べ替え"}</button>` +
        `<button data-s="desc">${isNum ? "↓ 大きい順に並べ替え" : "↓ 降順で並べ替え"}</button>` +
      `</div>` +
      (isNum ? `<div class="range"><input type="number" id="fmin" placeholder="以上" value="${cur.min ?? ""}">〜<input type="number" id="fmax" placeholder="以下" value="${cur.max ?? ""}"></div>` : "") +
      `<input class="fsearch" id="fsearch" type="search" placeholder="値を検索">` +
      `<div class="vals" id="fvals"></div>` +
      `<div class="fbtns"><button class="btn clear" id="fclear">クリア</button><button class="btn" id="fcancel">キャンセル</button><button class="btn ok" id="fok">OK</button></div>`;
    renderFilterValues();

    // 位置：押したボタンの下（画面右端からはみ出さないように）
    fmenu.style.display = "block";
    const rc = anchor.getBoundingClientRect();
    const left = Math.min(window.scrollX + rc.left, window.scrollX + document.documentElement.clientWidth - fmenu.offsetWidth - 8);
    fmenu.style.left = Math.max(8, left) + "px";
    fmenu.style.top = (window.scrollY + rc.bottom + 4) + "px";
    $("fsearch").focus();

    $("fsearch").addEventListener("input", ev => { fState.search = ev.target.value.trim().toLowerCase(); renderFilterValues(); });
    fmenu.querySelectorAll(".sorts button").forEach(b => b.addEventListener("click", () => {
      S.sortKey = k; S.sortDir = b.dataset.s; closeFilter(); renderTable();
    }));
    $("fcancel").addEventListener("click", closeFilter);
    $("fclear").addEventListener("click", () => { delete S.filters[k]; closeFilter(); S.page = 0; renderControls(); renderTable(); });
    $("fok").addEventListener("click", applyFilter);
    fmenu.addEventListener("keydown", ev => { if (ev.key === "Enter") applyFilter(); if (ev.key === "Escape") closeFilter(); });
  }

  function visibleValues() {
    const q = fState.search;
    return q ? fState.values.filter(v => v.toLowerCase().includes(q)) : fState.values;
  }
  function renderFilterValues() {
    const vis = visibleValues();
    const allOn = vis.length > 0 && vis.every(v => fState.checked.has(v));
    const shown = vis.slice(0, LIST_LIMIT);
    const col = COL[fState.k], isNum = isNumCol(col);
    const label = v => v === BLANK ? v : (col.t === "days" ? fmtDays(Number(v)) : (isNum ? fmt(v) : v));
    $("fvals").innerHTML =
      `<label class="all"><input type="checkbox" data-all="1" ${allOn ? "checked" : ""}>（${fState.search ? "検索結果を" : ""}すべて選択）</label>` +
      shown.map((v, i) =>
        `<label><input type="checkbox" data-i="${i}" ${fState.checked.has(v) ? "checked" : ""}>${esc(label(v))}<span class="cnt">${fmt(fState.counts.get(v))}</span></label>`
      ).join("") +
      (vis.length > LIST_LIMIT ? `<div class="more">ほか ${fmt(vis.length - LIST_LIMIT)} 件（検索で絞り込んでください）</div>` : "");
    $("fvals").onchange = ev => {
      const cb = ev.target;
      if (cb.dataset.all) { visibleValues().forEach(v => cb.checked ? fState.checked.add(v) : fState.checked.delete(v)); }
      else { const v = shown[Number(cb.dataset.i)]; cb.checked ? fState.checked.add(v) : fState.checked.delete(v); }
      renderFilterValues();
    };
  }
  function applyFilter() {
    const k = fState.k;
    const f = {};
    // 検索中にOKした場合は、Excelと同じく「検索に当てはまって、チェックされている値」だけ表示する
    const pool = fState.search ? visibleValues() : fState.values;
    const keep = pool.filter(v => fState.checked.has(v));
    if (keep.length !== fState.values.length) f.vals = new Set(keep);
    const mn = $("fmin"), mx = $("fmax");
    if (mn && mn.value !== "") f.min = Number(mn.value);
    if (mx && mx.value !== "") f.max = Number(mx.value);
    if (Object.keys(f).length) S.filters[k] = f; else delete S.filters[k];
    closeFilter(); S.page = 0; renderControls(); renderTable();
  }
  function closeFilter() { fmenu.style.display = "none"; fmenu.innerHTML = ""; fState = null; }
  document.addEventListener("mousedown", e => {
    if (fState && !fmenu.contains(e.target) && !e.target.closest(".fbtn")) closeFilter();
  });

  // ---------- 在庫推移グラフ（納品推奨数システムv5と同じ作り：行クリックでモーダル表示） ----------
  function renderStockChart(container, history) {
    if (!history || history.length === 0) {
      container.innerHTML = `<p style="color:var(--g-muted);font-size:13px;">在庫推移データがありません。</p>`;
      return;
    }
    const width = 640, height = 260;
    const padding = { top: 20, right: 20, bottom: 34, left: 46 };
    const values = history.map(h => h.stock);
    let maxV = Math.max(...values, 0);
    let minV = Math.min(...values, 0);
    if (maxV === minV) { maxV += 1; minV -= 1; }
    const n = history.length;
    const innerW = width - padding.left - padding.right;
    const innerH = height - padding.top - padding.bottom;
    const xStep = n > 1 ? innerW / (n - 1) : 0;
    const yScale = v => padding.top + innerH - ((v - minV) / (maxV - minV)) * innerH;
    const xOf = i => padding.left + i * xStep;

    const points = history.map((h, i) => `${xOf(i)},${yScale(h.stock)}`).join(" ");
    const fmtDate = d => (d && d.length === 8) ? `${d.slice(4, 6)}/${d.slice(6, 8)}` : d;
    const fmtDateWithYear = d => (d && d.length === 8) ? `${d.slice(0, 4)}/${d.slice(4, 6)}/${d.slice(6, 8)}` : d;
    const labelIdxs = n <= 6 ? history.map((_, i) => i) : [0, Math.floor((n - 1) / 2), n - 1];
    const xLabels = labelIdxs.map(i =>
      `<text x="${xOf(i)}" y="${height - padding.bottom + 18}" font-size="10" fill="var(--g-muted)" text-anchor="middle">${esc(fmtDate(history[i].d))}</text>`
    ).join("");
    const dots = history.map((h, i) => `<circle cx="${xOf(i)}" cy="${yScale(h.stock)}" r="2.5" fill="var(--g-accent)" />`).join("");

    // 横線メモリ（値の範囲に応じて10単位 or 100単位で引く）
    const gridStep = (maxV - minV) <= 200 ? 10 : 100;
    let gridLines = "";
    for (let v = Math.ceil(minV / gridStep) * gridStep; v <= maxV; v += gridStep) {
      const gy = yScale(v);
      gridLines += `<line x1="${padding.left}" y1="${gy}" x2="${width - padding.right}" y2="${gy}" stroke="var(--g-border)" stroke-dasharray="2,2" />`;
      gridLines += `<text x="${padding.left - 6}" y="${gy + 3}" font-size="9" fill="var(--g-muted)" text-anchor="end">${v}</text>`;
    }

    container.innerHTML = `
      <div style="position:relative;">
        <svg id="stock-chart-svg" viewBox="0 0 ${width} ${height}" style="width:100%;height:auto;display:block;cursor:crosshair;">
          ${gridLines}
          <line x1="${padding.left}" y1="${padding.top}" x2="${padding.left}" y2="${height - padding.bottom}" stroke="var(--g-border-md)" />
          <line x1="${padding.left}" y1="${height - padding.bottom}" x2="${width - padding.right}" y2="${height - padding.bottom}" stroke="var(--g-border-md)" />
          <polyline points="${points}" fill="none" stroke="var(--g-accent)" stroke-width="2" />
          ${dots}
          ${xLabels}
          <line id="stock-chart-hoverline" x1="0" y1="${padding.top}" x2="0" y2="${height - padding.bottom}" stroke="var(--g-muted)" stroke-dasharray="3,3" style="display:none;" />
          <circle id="stock-chart-hoverdot" r="4.5" fill="var(--g-accent)" stroke="#fff" stroke-width="1.5" style="display:none;" />
        </svg>
        <div id="stock-chart-tooltip" style="position:absolute;display:none;pointer-events:none;background:rgba(30,30,30,0.92);color:#fff;padding:5px 9px;border-radius:6px;font-size:12px;white-space:nowrap;transform:translate(-50%,-125%);z-index:10;"></div>
      </div>`;

    const svg = container.querySelector("#stock-chart-svg");
    const tooltip = container.querySelector("#stock-chart-tooltip");
    const hoverLine = container.querySelector("#stock-chart-hoverline");
    const hoverDot = container.querySelector("#stock-chart-hoverdot");

    function updateHover(clientX) {
      const rect = svg.getBoundingClientRect();
      const scaleX = width / rect.width, scaleY = height / rect.height;
      const mouseX = (clientX - rect.left) * scaleX;
      let idx = Math.round((mouseX - padding.left) / (xStep || 1));
      idx = Math.max(0, Math.min(n - 1, idx));
      const h = history[idx];
      const px = xOf(idx), py = yScale(h.stock);
      hoverLine.setAttribute("x1", px); hoverLine.setAttribute("x2", px); hoverLine.style.display = "block";
      hoverDot.setAttribute("cx", px); hoverDot.setAttribute("cy", py); hoverDot.style.display = "block";

      let diffText = "—";
      if (idx > 0) {
        const d = h.stock - history[idx - 1].stock;
        diffText = d > 0 ? `+${d}` : (d < 0 ? `${d}` : "±0");
      }
      tooltip.textContent = `${fmtDateWithYear(h.d)}：${h.stock}（前回比 ${diffText}）`;
      tooltip.style.display = "block";

      // ツールチップがモーダルの外に出て見切れないよう、表示領域の内側に収める
      const wrapW = rect.width, tipW = tooltip.offsetWidth, tipH = tooltip.offsetHeight;
      const pxPx = px / scaleX, pyPx = py / scaleY, margin = 4, half = tipW / 2;
      tooltip.style.left = `${Math.max(half + margin, Math.min(wrapW - half - margin, pxPx))}px`;
      tooltip.style.top = `${pyPx}px`;
      tooltip.style.transform = (pyPx - tipH * 1.25 < 0) ? "translate(-50%, 25%)" : "translate(-50%, -125%)";
    }
    svg.addEventListener("mousemove", e => updateHover(e.clientX));
    svg.addEventListener("mouseleave", () => {
      hoverLine.style.display = "none"; hoverDot.style.display = "none"; tooltip.style.display = "none";
    });
    svg.addEventListener("touchmove", e => {
      if (e.touches && e.touches[0]) { updateHover(e.touches[0].clientX); e.preventDefault(); }
    }, { passive: false });
  }

  // モーダルを「親ページ（Streamlit本体）から見て今画面に映っている範囲」に合わせて配置する（v5と同じ）
  function findSelfIframeInParent() {
    try {
      const frames = window.parent.document.querySelectorAll("iframe");
      for (let i = 0; i < frames.length; i++) if (frames[i].contentWindow === window) return frames[i];
    } catch (e) {}
    return null;
  }
  function positionModalToParentViewport(backdropEl) {
    let viewportH = window.innerHeight, visibleTop = window.scrollY || 0;
    try {
      const el = findSelfIframeInParent();
      if (el) {
        const rect = el.getBoundingClientRect();
        viewportH = window.parent.innerHeight;
        visibleTop = Math.max(0, -rect.top);
        visibleTop = Math.min(visibleTop, Math.max(0, rect.height - viewportH));
      }
    } catch (e) {}
    backdropEl.style.top = visibleTop + "px";
    backdropEl.style.height = viewportH + "px";
  }
  let modalRepositionHandler = null;
  const PERIODS = [[90, "3ヶ月"], [180, "6ヶ月"], [365, "1年"], [0, "全期間"]];
  let modalRow = null, period = 365;

  function breakdownHTML(r) {
    const chips = (items) => items.map(([l, v, main]) => `<span class="${main ? "main" : ""}">${l} <b>${v}</b></span>`).join("");
    const n = v => v == null ? "-" : fmt(v);
    let h = `<div class="breakdown"><div class="bt">在庫の内訳</div><div class="chips">` +
      chips([["テンポスター現在庫", r.tStock == null ? "（データなし）" : fmt(r.tStock), true], ["FBA在庫合計", n(r.fTotal), true]]) + `</div>`;
    h += `<div class="chips" style="margin-top:6px">` + chips([
      ["在庫あり", n(r.fAvail)], ["FC処理中", n(r.fProc)], ["出荷待ち", n(r.fShip)], ["FC移管中", n(r.fTrans)],
      ["入荷待ち", n(r.fIn)], ["販売不可", n(r.fUns)],
    ]) + `</div><div class="chips" style="margin-top:6px">` + chips([
      ["過去30日販売数", n(r.f30)], ["在庫日数（受領中含む）", r.fDays == null ? "-" : fmtDays(r.fDays)], ["Amazon推奨補充数", n(r.fRec)],
    ]) + `</div>`;
    if (r.asku) h += `<div class="muted" style="margin-top:8px">Amazon SKU：${esc(r.asku)}${r.asin ? `　ASIN：${esc(r.asin)}` : ""}</div>`;
    return h + `</div>`;
  }

  function renderModalBody() {
    const r = modalRow;
    $("stock-periods").innerHTML = PERIODS.map(([d, l]) => `<button data-d="${d}" class="${period === d ? "on" : ""}">${l}</button>`).join("");
    let hist = (D.hist[r.code] || []).map(p => ({ d: String(p[0]), stock: p[1] }));
    let note = "";
    if (period && hist.length) {
      const end = D.meta.latest ? new Date(D.meta.latest + "T00:00:00") : new Date();
      const st = new Date(end); st.setDate(st.getDate() - period + 1);
      const stYmd = `${st.getFullYear()}${String(st.getMonth() + 1).padStart(2, "0")}${String(st.getDate()).padStart(2, "0")}`;
      const inRange = hist.filter(h => h.d >= stYmd);
      if (!inRange.length) note = `<p style="color:var(--g-muted);font-size:13px;">この期間に在庫の変動はありません（最後の変動：${hist[hist.length - 1].d.replace(/(\d{4})(\d{2})(\d{2})/, "$1/$2/$3")}、在庫 ${fmt(hist[hist.length - 1].stock)}）。</p>`;
      hist = inRange;
    }
    const body = $("stock-modal-body");
    if (note) body.innerHTML = note; else renderStockChart(body, hist);
    body.insertAdjacentHTML("beforeend", breakdownHTML(r));
  }

  $("stock-periods").addEventListener("click", e => {
    const b = e.target.closest("button[data-d]"); if (!b) return;
    period = Number(b.dataset.d); renderModalBody();
  });

  function openStockModal(r) {
    const backdrop = $("stock-modal-backdrop");
    modalRow = r;
    $("stock-modal-title").textContent = `📈 在庫推移（${r.name ? `${r.code}／${r.name}` : r.code}）`;
    renderModalBody();
    backdrop.style.display = "flex";
    positionModalToParentViewport(backdrop);
    modalRepositionHandler = () => positionModalToParentViewport(backdrop);
    try {
      window.parent.addEventListener("scroll", modalRepositionHandler, true);
      window.parent.addEventListener("resize", modalRepositionHandler);
    } catch (e) {}
  }
  function closeStockModal() {
    $("stock-modal-backdrop").style.display = "none";
    if (modalRepositionHandler) {
      try {
        window.parent.removeEventListener("scroll", modalRepositionHandler, true);
        window.parent.removeEventListener("resize", modalRepositionHandler);
      } catch (e) {}
      modalRepositionHandler = null;
    }
  }
  $("stock-modal-backdrop").addEventListener("click", closeStockModal);
  $("stock-modal").addEventListener("click", e => e.stopPropagation());
  $("stock-modal-close").addEventListener("click", closeStockModal);
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeStockModal(); });
})();
</script>
</body>
</html>
